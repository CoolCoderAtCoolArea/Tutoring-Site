# Netlify settings. Netlify detects Next.js automatically; this file just makes
# the important bits explicit. Environment variables are set in the Netlify
# dashboard (Site configuration -> Environment variables), NOT here.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# netlify/functions/reminders.mts runs every hour to send 24-hour reminder emails.
[functions]
  directory = "netlify/functions"
